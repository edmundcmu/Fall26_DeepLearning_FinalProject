# Locked protocol for FA-JOINT adapter selection (IDL.pdf §3.3, §4).
# Every TBD must be agreed by the team and frozen BEFORE any probe response or
# selection score is inspected; changing a value afterwards invalidates the comparison.

data:
  prepared_dir: i-x20/uma_cuh_baseline/data/prepared   # IDL §3.2 cell-family split (500/100/200)
  split_seed: TBD               # selector-dev / checkpoint-val / probe-pool sampling
  n_selector_dev: 50            # IDL §3.2
  n_checkpoint_val: 50          # IDL §3.2
  n_probe_pool: 40              # IDL §4.1: 30-50 training configurations

model:
  checkpoint: uma-m-1p1         # IDL §5.2
  task: oc20

objective:                      # IDL Eq. (2)
  w_energy: 0.10
  w_force_h: 0.45
  w_force_cu: 0.45
  scale_statistic: TBD          # rms | std of U0 residuals on the training subset
  no_h_batch_policy: TBD        # renormalize | skip_term (Cu54 frames contain no H)

adapters:                       # read by src/LoRA (LoRAConfig.from_yaml)
  rank: 2                       # IDL §4.1
  alpha: null                   # scaling = alpha / rank; null keeps IDL Eq. (3): W + B A
  dropout: 0.0                  # only ever applied at invariant-input sites (radial / scalar MLPs)
  so3_per_l: true               # proposed: one (A, B) pair per degree l; lock before probes
  group_ranks: {}               # optional per-group rank override, e.g. to equalize budgets
                                # MoLE sites get an output-level update shared by all experts.
  # Proposed groups: role x depth. R = radial MLP (pair/distance strength), S = SO(2)
  # convolutions (sigma/pi/delta channel coupling), A = atom-wise update. Assumes 10 blocks;
  # check with `python -m src.LoRA --checkpoint <uma-m-1p1.pt>`, which lists every
  # site per group and any legal site left in no group. Lock before probes.
  groups:
    R_early: ['(^|\.)blocks\.[0-4]\.edge_wise\.so2_conv_1\.rad_func\.net\.\d+$']
    R_late:  ['(^|\.)blocks\.[5-9]\.edge_wise\.so2_conv_1\.rad_func\.net\.\d+$']
    S_early: ['(^|\.)blocks\.[0-4]\.edge_wise\.so2_conv_[12]\.(fc_m0|so2_m_conv\.\d+\.fc)$']
    S_late:  ['(^|\.)blocks\.[5-9]\.edge_wise\.so2_conv_[12]\.(fc_m0|so2_m_conv\.\d+\.fc)$']
    A_early: ['(^|\.)blocks\.[0-4]\.atom_wise\.(scalar_mlp\.\d+|so3_linear_[12]|grid_mlp\.\d+)$']
    A_late:  ['(^|\.)blocks\.[5-9]\.atom_wise\.(scalar_mlp\.\d+|so3_linear_[12]|grid_mlp\.\d+)$']

probe:
  steps: TBD                    # IDL §4.1: 20-50 updates
  relative_update_cap: TBD      # kappa in ||B A||_F / ||W||_F <= kappa
  seeds: [TBD, TBD]             # second seed = probe-stability check (IDL §4.3)
  optimizer: TBD
  lr: TBD
  batch_size: TBD

selection:
  parameter_budget: TBD         # trainable parameters, shared by every method
  ridge_lambda: TBD
  stop_policy: TBD              # fill_budget | positive_gain
  force_gradient_score: TBD     # e.g. sum of squared Frobenius norms of dL_F/dB
  force_gradient_cost_normalized: TBD
  random_mask_seed: TBD
  n_random_masks: 3             # one predeclared mask per paired repeat (IDL §4.3)

final_training:
  max_updates: 2000             # IDL §4.3; any increase to 4000 is decided before the suite
  repeat_seeds: [TBD, TBD, TBD] # three paired repeats
  checkpoint_every: TBD
  optimizer: TBD
  lr: TBD
  batch_size: TBD
